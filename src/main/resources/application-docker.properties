spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

app.dev-admin.enabled=${APP_DEV_ADMIN_ENABLED:false}
app.dev-admin.nome=${APP_DEV_ADMIN_NOME:Admin Docker}
app.dev-admin.email=${APP_DEV_ADMIN_EMAIL:}
app.dev-admin.senha=${APP_DEV_ADMIN_SENHA:}
